spring.application.name=webshop-gateway

#server
server.port=${PORT:8090}

# Addresses of the services behind the gateway
app.auth-server-url=${AUTH_SERVER_URL:http://localhost:8080}
app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
app.order-service-url=${ORDER_SERVICE_URL:http://localhost:8082}

# CorsConfig
# The frontend addresses that may call the gateway from the browser.
cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}