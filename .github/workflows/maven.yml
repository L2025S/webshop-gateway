# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven and Push Docker Image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # lets you run the workflow manually from the Actions tab

jobs:

  # Job 1: compile and run the tests (runs on pushes AND on pull requests)
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml



    # Job 2: build the Docker image and push it to Docker Hub.
    # Only runs after the build job succeeded, and never for pull requests.
  docker:
      needs: build
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        # Same action versions as the product-service workflow
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Extract metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
            tags: |
              type=raw,value=latest
              type=sha,prefix=,format=short

        - name: Build and push Docker image
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            provenance: false
            sbom: false




    
